[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memelang"
version = "0.1.0"
description = "Natural language programming compiler with deterministic IR, lockfile, and multi-target backends"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
local-gguf = ["llama-cpp-python>=0.3"]

[project.scripts]
meme = "memelang.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/memelang"]

[tool.pytest.ini_options]
testpaths = ["tests"]
