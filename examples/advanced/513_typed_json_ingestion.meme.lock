      "canonical_meme": "record DatasetSummary:\n    int_sum: Int\n    float_count: Int\n    first_tag: String\n    active_count: Int\nwrite file \"ints.json\" with \" [ 10 , -5 , 42 , 0 ] \"\nwrite file \"floats.json\" with \"[\\n  1.5,\\n  2.25,\\n  -0.75\\n]\"\nwrite file \"tags.json\" with \"[\\\"alpha, beta\\\", \\\"quote:\\\\\\\"ok\\\\\\\"\\\", \\\"line1\\\\nline2\\\"]\"\nwrite file \"flags.json\" with \"[ true , false , true , true ]\"\ndefine list nums as read json file \"ints.json\" as List<Int>\ndefine list weights as read json file \"floats.json\" as List<Float>\ndefine list tags as read json file \"tags.json\" as List<String>\ndefine list flags as read json file \"flags.json\" as List<Bool>\ndefine total: Int as 0\nfor each n in nums:\n    set total to total + n\ndefine trues: Int as 0\nfor each b in flags:\n    if b:\n        set trues to trues + 1\ndefine summary: DatasetSummary as DatasetSummary(int_sum=total, float_count=length of weights, first_tag=tags[0], active_count=trues)\nprint summary\nprint tags[1]\nprint weights",
