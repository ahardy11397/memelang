      "canonical_meme": "define fruits as empty set of String\nadd \"banana\" to set fruits\nadd \"apple\" to set fruits\nadd \"cherry\" to set fruits\nadd \"apple\" to set fruits\nprint \"count\", length of set fruits\nfor each fruit in fruits:\n    print \"fruit\", fruit\nrecord Point:\n    x: Int\n    y: Int\ndefine pts as empty set of Point\nadd Point(x=2, y=3) to set pts\nadd Point(x=1, y=1) to set pts\nadd Point(x=2, y=3) to set pts\nprint \"points\", length of set pts\nif pts contains Point(x=1, y=1):\n    print \"has origin-ish: true\"\nelse:\n    print \"has origin-ish: false\"\nremove Point(x=1, y=1) from set pts\nprint \"points after remove\", length of set pts",
