      "canonical_meme": "record InventoryItem:\n    sku: String\n    name: String\n    quantity: Int\n    reorder_threshold: Int\nfunction format_item_id(id_num: Int, width: Int) -> String:\n    define raw: String as text of id_num\n    define padded: String as raw\n    while length of string padded < width:\n        set padded to \"0\" + padded\n    return padded\nfunction parse_csv_row(row: String) -> InventoryItem:\n    define list parts as split row by \",\"\n    define sku: String as trim parts[0]\n    define name: String as trim parts[1]\n    define qty: Int as integer value of parts[2]\n    define threshold: Int as integer value of parts[3]\n    return InventoryItem(sku=sku, name=name, quantity=qty, reorder_threshold=threshold)\ndefine list rows as empty List<String>\nappend \"SKU-101, Widget A, 42, 50\" to rows\nappend \"SKU-102, Gadget B, 15, 10\" to rows\nappend \"SKU-103, Cable C, 8, 25\" to rows\nappend \"SKU-104, Adapter D, 120, 100\" to rows\ndefine total_received: Int as 0\ndefine reorder_count: Int as 0\nprint \"--- Processing Inventory Batch ---\"\nfor each row in rows:\n    define item: InventoryItem as parse_csv_row(row)\n    define tag: String as format_item_id(item.quantity, 4)\n    if item.quantity < item.reorder_threshold:\n        set reorder_count to reorder_count + 1\n        define restock_qty: Int as 25\n        define new_qty: Int as item.quantity + restock_qty\n        set total_received to total_received + restock_qty\n        define new_tag: String as format_item_id(new_qty, 4)\n        print item.sku, item.name, \"LOW:\", tag, \"-> restocked to:\", text of new_qty, \"code:\", new_tag\n    else:\n        print item.sku, item.name, \"OK :\", tag\nprint \"--- Summary ---\"\nprint \"Reordered items:\", reorder_count\nprint \"Total units added:\", total_received\nprint \"Final batch ID:\", \"BATCH-\" + format_item_id(total_received, 6)",
