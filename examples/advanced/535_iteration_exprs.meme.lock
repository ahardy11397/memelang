      "canonical_meme": "record Task:\n    name: String\n    deps: List<String>\nfunction get_items() -> List<Int>:\n    return [10, 20, 30]\ndefine t: Task as Task(name=\"release\", deps=[\"build\", \"test\", \"deploy\"])\nfor each d in t.deps:\n    print \"dep:\", d\nfor each item in get_items():\n    print \"item:\", item\ndefine list grid as [[1, 2, 3], [4, 5, 6]]\nfor each cell in grid[0]:\n    print \"cell:\", cell\nfor each index i item d in t.deps:\n    print \"idx:\", i, d",
