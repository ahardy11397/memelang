      "canonical_meme": "define raw: String as \"  prefix_Alpha,Beta,Gamma_suffix  \"\ndefine cleaned: String as trim raw\nprint cleaned\nif cleaned starts with \"prefix_\" and cleaned contains \"Beta\":\n    define body: String as replace \"prefix_\" with \"\" in cleaned\n    set body to replace \"_suffix\" with \"\" in body\n    define upper_body: String as upper body\n    define lower_body: String as lower upper_body\n    print upper_body, lower_body\n    define list parts as split lower_body by \",\"\n    define joined: String as join parts with \"|\"\n    define beta_idx: Int as index of \"beta\" in joined\n    define missing_idx: Int as index of \"delta\" in joined\n    define first_ch: String as char at 0 of joined\n    print joined, beta_idx, missing_idx, first_ch",
