      "canonical_meme": "record Credentials:\n    username: String\n    token: String\nrecord Session:\n    session_id: String\n    user_id: Int\n    role: String\n    is_valid: Bool\nrecord AuthResponse:\n    status_code: Int\n    message: String\n    session: Session\nfunction authenticate(creds: Credentials, tokens: Map<String, String>, user_ids: Map<String, Int>, roles: Map<String, String>) -> AuthResponse:\n    if tokens has key creds.username:\n        if tokens[creds.username] == creds.token:\n            define uid: Int as user_ids[creds.username] default 0\n            define role_name: String as roles[creds.username] default \"viewer\"\n            return AuthResponse(status_code=200, message=\"OK\", session=Session(session_id=\"sess_valid\", user_id=uid, role=role_name, is_valid=true))\n        else:\n            return AuthResponse(status_code=401, message=\"Invalid token\", session=Session(session_id=\"\", user_id=0, role=\"none\", is_valid=false))\n    else:\n        return AuthResponse(status_code=401, message=\"User not found\", session=Session(session_id=\"\", user_id=0, role=\"none\", is_valid=false))\ndefine tokens: Map<String, String> as {\"alice\": \"tok_alice_secure\", \"bob\": \"tok_bob_pass\"}\ndefine user_ids: Map<String, Int> as {\"alice\": 101, \"bob\": 102}\ndefine roles: Map<String, String> as {\"alice\": \"admin\", \"bob\": \"operator\"}\ndefine req1: Credentials as Credentials(username=\"alice\", token=\"tok_alice_secure\")\ndefine res1: AuthResponse as authenticate(req1, tokens, user_ids, roles)\nprint res1.status_code, res1.message, res1.session.role, res1.session.is_valid\ndefine req2: Credentials as Credentials(username=\"bob\", token=\"wrong_secret\")\ndefine res2: AuthResponse as authenticate(req2, tokens, user_ids, roles)\nprint res2.status_code, res2.message, res2.session.is_valid\ndefine req3: Credentials as Credentials(username=\"eve\", token=\"tok_unknown\")\ndefine res3: AuthResponse as authenticate(req3, tokens, user_ids, roles)\nprint res3.status_code, res3.message, res3.session.is_valid",
