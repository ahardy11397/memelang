      "canonical_meme": "define t1: Int as current epoch seconds\ndefine t2: Int as current epoch seconds\nassert t1 > 0\nassert t2 >= t1\nprint \"clock valid: true\"\ndefine unset_val: Optional<String> as environment variable \"MEME_NONEXISTENT_VAR_529\"\nif unset_val is nothing:\n    print \"unset is nothing: true\"\nelse:\n    print \"unset is nothing: false\"\ndefine fallback_val: String as environment variable \"MEME_NONEXISTENT_VAR_529\" or else \"fallback_value_ok\"\nprint \"fallback:\", fallback_val\ndefine path_val: String as environment variable \"PATH\" or else \"no_path\"\nassert path_val != \"no_path\"\nprint \"path exists: true\"",
