      "canonical_meme": "function classify_status(code: Int) -> String:\n    match code:\n        when 200:\n            return \"OK\"\n        when 404:\n            return \"Not Found\"\n        when 500:\n            return \"Server Error\"\n        otherwise:\n            return \"Unknown Code\"\nfunction format_role(role: String) -> String:\n    define title: String as \"Guest\"\n    match role:\n        when \"admin\":\n            set title to \"Administrator\"\n        when \"editor\":\n            set title to \"Content Editor\"\n    return title\nfunction describe_flag(flag: Bool) -> String:\n    match flag:\n        when true:\n            return \"Enabled\"\n        otherwise:\n            return \"Disabled\"\nprint \"Status 200:\", classify_status(200)\nprint \"Status 404:\", classify_status(404)\nprint \"Status 418:\", classify_status(418)\nprint \"Role admin:\", format_role(\"admin\")\nprint \"Role viewer:\", format_role(\"viewer\")\nprint \"Flag true:\", describe_flag(true)\nprint \"Flag false:\", describe_flag(false)",
