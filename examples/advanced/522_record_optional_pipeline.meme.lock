      "canonical_meme": "record Job:\n    id: Int\n    name: String\n    priority: Int\n    active: Bool\nfunction find_job_name(jobs: List<Job>, target_id: Int) -> Optional<String>:\n    for each j in jobs:\n        if j.id == target_id:\n            return optional j.name\n    return nothing\nfunction build_priority_map(jobs: List<Job>) -> Map<String, Int>:\n    define m: Map<String, Int> as empty Map<String, Int>\n    for each j in jobs:\n        set m[j.name] to j.priority\n    return m\ndefine list jobs as empty List<Job>\nappend Job(id=1, name=\"worker-deploy\", priority=90, active=true) to jobs\nappend Job(id=2, name=\"cache-purge\", priority=45, active=false) to jobs\nappend Job(id=3, name=\"audit-report\", priority=75, active=true) to jobs\nappend Job(id=4, name=\"backup-archive\", priority=60, active=true) to jobs\ndefine prio_map: Map<String, Int> as build_priority_map(jobs)\nprint \"Priority map entries:\"\nfor each name in prio_map:\n    print name, prio_map[name]\ndefine found_opt: Optional<String> as find_job_name(jobs, 3)\nif found_opt is not nothing:\n    print \"Found job 3:\", value of found_opt\ndefine missing_opt: Optional<String> as find_job_name(jobs, 99)\ndefine fallback_name: String as value of missing_opt or else \"unassigned\"\nprint \"Missing job 99:\", fallback_name\ndefine list active_jobs as empty List<Job>\nfor each j in jobs:\n    if j.active:\n        append j to active_jobs\nprint \"Active jobs count:\", length of active_jobs\nfor each j in active_jobs:\n    print \"Active job:\", j.name, \"priority:\", j.priority",
