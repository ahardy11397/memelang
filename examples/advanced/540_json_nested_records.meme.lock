      "canonical_meme": "record Item:\n    name: String\n    quantity: Int\nrecord Order:\n    id: String\n    items: List<Item>\n    metadata: Map<String, Item>\ndefine i1: Item as Item(name=\"Widget\", quantity=3)\ndefine i2: Item as Item(name=\"Gadget\", quantity=7)\ndefine list items_list as [i1, i2]\ndefine meta_map: Map<String, Item> as empty Map<String, Item>\nset meta_map[\"primary\"] to i1\nset meta_map[\"secondary\"] to i2\ndefine ord: Order as Order(id=\"ORD-100\", items=items_list, metadata=meta_map)\nwrite ord as json to file \"tmp_order_540.json\"\ndefine list fallback_items as empty List<Item>\ndefine fallback_meta: Map<String, Item> as empty Map<String, Item>\ndefine fallback_ord: Order as Order(id=\"FALLBACK\", items=fallback_items, metadata=fallback_meta)\ndefine loaded_ord_opt: Optional<Order> as read json record Order from file \"tmp_order_540.json\" or else nothing\nif loaded_ord_opt is not nothing:\n    define loaded_ord: Order as value of loaded_ord_opt\n    print \"order id:\", loaded_ord.id\n    print \"items count:\", length of loaded_ord.items\n    for each itm in loaded_ord.items:\n        print \"item:\", itm.name, itm.quantity\n    define prim: Item as loaded_ord.metadata[\"primary\"]\n    print \"primary item:\", prim.name, prim.quantity\ndelete file \"tmp_order_540.json\"",
