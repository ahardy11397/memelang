      "canonical_meme": "record HttpRequest:\n    method: String\n    path: String\n    body_username: String\n    body_email: String\n    body_age: Int\nrecord HttpResponse:\n    status_code: Int\n    error_type: String\n    error_detail: String\n    user_id: Int\n    is_success: Bool\nfunction handle_registration(req: HttpRequest, existing: Map<String, Bool>, next_id: Int) -> HttpResponse:\n    if req.method != \"POST\":\n        return HttpResponse(status_code=405, error_type=\"METHOD_NOT_ALLOWED\", error_detail=\"Expected POST\", user_id=0, is_success=false)\n    else:\n        if req.path != \"/api/v1/users\":\n            return HttpResponse(status_code=404, error_type=\"NOT_FOUND\", error_detail=\"Unknown resource\", user_id=0, is_success=false)\n        else:\n            if length of string req.body_username < 3:\n                return HttpResponse(status_code=400, error_type=\"INVALID_FIELD\", error_detail=\"Username too short\", user_id=0, is_success=false)\n            else:\n                if req.body_age < 13:\n                    return HttpResponse(status_code=422, error_type=\"POLICY_VIOLATION\", error_detail=\"Minimum age is 13\", user_id=0, is_success=false)\n                else:\n                    if existing has key req.body_username:\n                        return HttpResponse(status_code=409, error_type=\"CONFLICT\", error_detail=\"Username already taken\", user_id=0, is_success=false)\n                    else:\n                        return HttpResponse(status_code=201, error_type=\"NONE\", error_detail=\"\", user_id=next_id, is_success=true)\ndefine existing_users: Map<String, Bool> as {\"admin\": true, \"root\": true}\ndefine r1: HttpRequest as HttpRequest(method=\"POST\", path=\"/api/v1/users\", body_username=\"dev_alice\", body_email=\"alice@cloud.corp\", body_age=28)\ndefine res1: HttpResponse as handle_registration(r1, existing_users, 1001)\nprint res1.status_code, res1.is_success, res1.user_id\nset existing_users[r1.body_username] to true\ndefine r2: HttpRequest as HttpRequest(method=\"POST\", path=\"/api/v1/users\", body_username=\"dev_alice\", body_email=\"alice2@cloud.corp\", body_age=29)\ndefine res2: HttpResponse as handle_registration(r2, existing_users, 1002)\nprint res2.status_code, res2.is_success, res2.error_type, res2.error_detail\ndefine r3: HttpRequest as HttpRequest(method=\"POST\", path=\"/api/v1/users\", body_username=\"junior_coder\", body_email=\"kid@coder.net\", body_age=11)\ndefine res3: HttpResponse as handle_registration(r3, existing_users, 1003)\nprint res3.status_code, res3.is_success, res3.error_type, res3.error_detail\ndefine r4: HttpRequest as HttpRequest(method=\"GET\", path=\"/api/v1/users\", body_username=\"anybody\", body_email=\"any@corp.net\", body_age=25)\ndefine res4: HttpResponse as handle_registration(r4, existing_users, 1004)\nprint res4.status_code, res4.is_success, res4.error_type",
