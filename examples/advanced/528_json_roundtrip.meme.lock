      "canonical_meme": "record Item:\n    id: Int\n    sku: String\n    price: Float\n    in_stock: Bool\ndefine itm: Item as Item(id=101, sku=\"WIDGET-A\", price=19.95, in_stock=true)\nwrite itm as json to file \"tmp_528_single.json\"\ndefine itm_opt: Optional<Item> as read json record Item from file \"tmp_528_single.json\" or else nothing\nif itm_opt is nothing:\n    print \"single: nothing\"\nelse:\n    define item: Item as value of itm_opt\n    assert item.id == itm.id\n    assert item.sku == itm.sku\n    assert item.price == itm.price\n    assert item.in_stock == itm.in_stock\n    print \"single item:\", item.id, item.sku, format item.price with 2 decimals, item.in_stock\ndefine itm2: Item as Item(id=102, sku=\"GADGET-B\", price=49.5, in_stock=false)\ndefine itm3: Item as Item(id=103, sku=\"TOOL-C\", price=10.0, in_stock=true)\ndefine list items as [itm, itm2, itm3]\nwrite items as json to file \"tmp_528_list.json\"\ndefine items_opt: Optional<List<Item>> as read json records Item from file \"tmp_528_list.json\" or else nothing\nif items_opt is nothing:\n    print \"list: nothing\"\nelse:\n    define list back_items as value of items_opt\n    assert length of back_items == 3\n    for each item in back_items:\n        print \"list item:\", item.id, item.sku, format item.price with 2 decimals, item.in_stock\ndefine single_raw: String as read string from file \"tmp_528_single.json\"\ndefine list_raw: String as read string from file \"tmp_528_list.json\"\nprint \"single raw json:\", single_raw\nprint \"list raw json:\", list_raw\ndelete file \"tmp_528_single.json\"\ndelete file \"tmp_528_list.json\"",
