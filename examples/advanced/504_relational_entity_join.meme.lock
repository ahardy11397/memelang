      "canonical_meme": "record Customer:\n    id: Int\n    name: String\n    tier: String\nrecord Product:\n    id: Int\n    title: String\n    unit_price_cents: Int\nrecord Order:\n    order_id: Int\n    customer_id: Int\n    product_id: Int\n    quantity: Int\nrecord OrderReport:\n    order_id: Int\n    customer_name: String\n    product_title: String\n    subtotal_cents: Int\n    discount_cents: Int\n    final_total_cents: Int\nfunction join_order(ord: Order, customers: Map<Int, Customer>, products: Map<Int, Product>) -> OrderReport:\n    define cust: Customer as customers[ord.customer_id]\n    define prod: Product as products[ord.product_id]\n    define subtotal: Int as prod.unit_price_cents * ord.quantity\n    define discount: Int as 0\n    if cust.tier == \"VIP\":\n        set discount to subtotal * 15 / 100\n    else:\n        if cust.tier == \"PRO\":\n            set discount to subtotal * 5 / 100\n        else:\n            set discount to 0\n    define final_total: Int as subtotal - discount\n    return OrderReport(order_id=ord.order_id, customer_name=cust.name, product_title=prod.title, subtotal_cents=subtotal, discount_cents=discount, final_total_cents=final_total)\ndefine c1: Customer as Customer(id=1, name=\"Alice\", tier=\"VIP\")\ndefine c2: Customer as Customer(id=2, name=\"Bob\", tier=\"PRO\")\ndefine c3: Customer as Customer(id=3, name=\"Charlie\", tier=\"STANDARD\")\ndefine customers: Map<Int, Customer> as empty Map<Int, Customer>\nset customers[c1.id] to c1\nset customers[c2.id] to c2\nset customers[c3.id] to c3\ndefine p1: Product as Product(id=10, title=\"Widget-Pro\", unit_price_cents=2000)\ndefine p2: Product as Product(id=20, title=\"USB-Cable\", unit_price_cents=1000)\ndefine products: Map<Int, Product> as empty Map<Int, Product>\nset products[p1.id] to p1\nset products[p2.id] to p2\ndefine o1: Order as Order(order_id=501, customer_id=1, product_id=10, quantity=3)\ndefine o2: Order as Order(order_id=502, customer_id=2, product_id=20, quantity=4)\ndefine o3: Order as Order(order_id=503, customer_id=3, product_id=10, quantity=2)\ndefine list orders as [o1, o2, o3]\ndefine grand_total: Int as 0\nfor each ord in orders:\n    define rep: OrderReport as join_order(ord, customers, products)\n    print rep.order_id, rep.customer_name, rep.product_title, rep.subtotal_cents, rep.discount_cents, rep.final_total_cents\n    set grand_total to grand_total + rep.final_total_cents\nprint grand_total",
