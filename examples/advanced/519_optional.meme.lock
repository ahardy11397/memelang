      "canonical_meme": "function find_first_even(nums: List<Int>) -> Optional<Int>:\n    for each n in nums:\n        if n % 2 == 0:\n            return optional n\n    return nothing\nfunction greet(user: Optional<String>) -> String:\n    define name: String as value of user or else \"Guest\"\n    return \"Hello, \" + name\ndefine missing: Optional<Int> as find_first_even([1, 3, 5])\ndefine found: Optional<Int> as find_first_even([1, 3, 4, 7])\nif missing is nothing:\n    print \"missing is nothing: true\"\nelse:\n    print \"missing is nothing: false\"\nif found is not nothing:\n    print \"found is not nothing: true\"\nelse:\n    print \"found is not nothing: false\"\ndefine v_missing: Int as value of missing or else -1\ndefine v_found: Int as value of found or else -1\nprint \"v_missing:\", v_missing\nprint \"v_found:\", v_found\ndefine unwrapped: Int as value of found\nprint \"strict unwrapped:\", unwrapped\ndefine anon: Optional<String> as nothing\ndefine named: Optional<String> as optional \"Alice\"\nprint greet(anon)\nprint greet(named)",
