      "canonical_meme": "function first_divisible_above(items: List<Int>, divisor: Int, floor: Int) -> Int:\n    define found: Int as -1\n    for each n in items:\n        if n <= floor:\n            continue\n        if n % divisor == 0:\n            set found to n\n            break\n    return found\ndefine list readings as [3, 6, 9, 12, 14, 18, 21, 24]\nprint \"first_match\", first_divisible_above(readings, 6, 10)\nprint \"no_match\", first_divisible_above(readings, 100, 0)\ndefine odd_sum: Int as 0\nfor i from 1 to 15:\n    if i % 2 == 0:\n        continue\n    if odd_sum + i > 25:\n        break\n    set odd_sum to odd_sum + i\nprint \"odd_sum\", odd_sum\ndefine cursor: Int as 0\ndefine scanned: Int as 0\nwhile cursor < length of readings:\n    define val: Int as readings[cursor]\n    set cursor to cursor + 1\n    if val % 2 != 0:\n        continue\n    set scanned to scanned + val\n    if scanned >= 30:\n        break\nprint \"cursor\", cursor, \"scanned\", scanned",
