      "canonical_meme": "record PaymentRequest:\n    account_id: String\n    amount_cents: Int\n    currency: String\n    idempotency_key: String\nrecord TxReceipt:\n    success: Bool\n    error_code: String\n    fee_cents: Int\n    net_debited_cents: Int\n    new_balance_cents: Int\nfunction validate_and_charge(req: PaymentRequest, balances: Map<String, Int>, processed: Map<String, Bool>, fee_percent: Int) -> TxReceipt:\n    if req.currency != \"USD\":\n        define bal: Int as balances[req.account_id] default 0\n        return TxReceipt(success=false, error_code=\"UNSUPPORTED_CURRENCY\", fee_cents=0, net_debited_cents=0, new_balance_cents=bal)\n    else:\n        if processed has key req.idempotency_key:\n            define bal: Int as balances[req.account_id] default 0\n            return TxReceipt(success=false, error_code=\"DUPLICATE_REQUEST\", fee_cents=0, net_debited_cents=0, new_balance_cents=bal)\n        else:\n            if req.amount_cents <= 0:\n                define bal: Int as balances[req.account_id] default 0\n                return TxReceipt(success=false, error_code=\"INVALID_AMOUNT\", fee_cents=0, net_debited_cents=0, new_balance_cents=bal)\n            else:\n                define current_bal: Int as balances[req.account_id] default 0\n                define fee: Int as req.amount_cents * fee_percent / 100\n                define total_debit: Int as req.amount_cents + fee\n                if current_bal < total_debit:\n                    return TxReceipt(success=false, error_code=\"INSUFFICIENT_FUNDS\", fee_cents=0, net_debited_cents=0, new_balance_cents=current_bal)\n                else:\n                    define rem_bal: Int as current_bal - total_debit\n                    return TxReceipt(success=true, error_code=\"NONE\", fee_cents=fee, net_debited_cents=total_debit, new_balance_cents=rem_bal)\ndefine balances: Map<String, Int> as {\"acct_prime\": 50000}\ndefine processed_keys: Map<String, Bool> as empty Map<String, Bool>\ndefine tx1: PaymentRequest as PaymentRequest(account_id=\"acct_prime\", amount_cents=10000, currency=\"USD\", idempotency_key=\"tx_idem_001\")\ndefine r1: TxReceipt as validate_and_charge(tx1, balances, processed_keys, 2)\nprint r1.success, r1.error_code, r1.fee_cents, r1.net_debited_cents, r1.new_balance_cents\nset balances[\"acct_prime\"] to r1.new_balance_cents\nset processed_keys[\"tx_idem_001\"] to true\ndefine tx2: PaymentRequest as PaymentRequest(account_id=\"acct_prime\", amount_cents=10000, currency=\"USD\", idempotency_key=\"tx_idem_001\")\ndefine r2: TxReceipt as validate_and_charge(tx2, balances, processed_keys, 2)\nprint r2.success, r2.error_code, r2.new_balance_cents\ndefine tx3: PaymentRequest as PaymentRequest(account_id=\"acct_prime\", amount_cents=45000, currency=\"USD\", idempotency_key=\"tx_idem_002\")\ndefine r3: TxReceipt as validate_and_charge(tx3, balances, processed_keys, 2)\nprint r3.success, r3.error_code, r3.new_balance_cents\ndefine tx4: PaymentRequest as PaymentRequest(account_id=\"acct_prime\", amount_cents=5000, currency=\"EUR\", idempotency_key=\"tx_idem_003\")\ndefine r4: TxReceipt as validate_and_charge(tx4, balances, processed_keys, 2)\nprint r4.success, r4.error_code, r4.new_balance_cents",
