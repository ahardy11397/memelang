      "canonical_meme": "record ConfigProfile:\n    name: String\n    ports: List<Int>\n    tags: Set<String>\n    settings: Map<String, String>\ndefine list sample_ports as [80, 443, 8080]\ndefine sample_tags as empty set of String\nadd \"web\" to set sample_tags\nadd \"prod\" to set sample_tags\ndefine sample_settings: Map<String, String> as empty Map<String, String>\nset sample_settings[\"region\"] to \"us-west\"\nset sample_settings[\"env\"] to \"production\"\ndefine profile: ConfigProfile as ConfigProfile(name=\"gateway\", ports=sample_ports, tags=sample_tags, settings=sample_settings)\nwrite profile as json to file \"tmp_profile.json\"\ndefine list fallback_ports as empty List<Int>\ndefine fallback_tags as empty set of String\ndefine fallback_settings: Map<String, String> as empty Map<String, String>\ndefine fallback_profile: ConfigProfile as ConfigProfile(name=\"default\", ports=fallback_ports, tags=fallback_tags, settings=fallback_settings)\ndefine loaded_opt: Optional<ConfigProfile> as read json record ConfigProfile from file \"tmp_profile.json\" or else nothing\nif loaded_opt is not nothing:\n    define loaded: ConfigProfile as value of loaded_opt\n    print \"name:\", loaded.name\n    print \"ports count:\", length of loaded.ports\n    for each p in loaded.ports:\n        print \"port:\", p\n    print \"has web tag:\", loaded.tags contains \"web\"\n    print \"region:\", loaded.settings[\"region\"]\n    print \"env:\", loaded.settings[\"env\"]\ndelete file \"tmp_profile.json\"",
