      "canonical_meme": "record Subject:\n    user_id: Int\n    name: String\n    role: String\nrecord AccessRequest:\n    user_id: Int\n    resource: String\n    action: String\nrecord Decision:\n    allowed: Bool\n    reason: String\nfunction check_permission(req: AccessRequest, users: Map<Int, Subject>, role_perms: Map<String, List<String>>) -> Decision:\n    if users has key req.user_id:\n        define sub: Subject as users[req.user_id]\n        if role_perms has key sub.role:\n            define list perms as role_perms[sub.role]\n            define target_perm: String as req.resource + \":\" + req.action\n            define has_grant: Bool as false\n            for each p in perms:\n                if p == target_perm:\n                    set has_grant to true\n            if has_grant:\n                return Decision(allowed=true, reason=\"ROLE_PERMISSION_GRANTED\")\n            else:\n                return Decision(allowed=false, reason=\"ACTION_DENIED\")\n        else:\n            return Decision(allowed=false, reason=\"ROLE_NOT_CONFIGURED\")\n    else:\n        return Decision(allowed=false, reason=\"UNKNOWN_SUBJECT\")\ndefine s1: Subject as Subject(user_id=1, name=\"Alice\", role=\"admin\")\ndefine s2: Subject as Subject(user_id=2, name=\"Bob\", role=\"auditor\")\ndefine s3: Subject as Subject(user_id=3, name=\"Charlie\", role=\"member\")\ndefine users: Map<Int, Subject> as empty Map<Int, Subject>\nset users[1] to s1\nset users[2] to s2\nset users[3] to s3\ndefine role_perms: Map<String, List<String>> as empty Map<String, List<String>>\nset role_perms[\"admin\"] to [\"users:read\", \"users:write\", \"billing:read\", \"billing:write\"]\nset role_perms[\"auditor\"] to [\"users:read\", \"billing:read\"]\nset role_perms[\"member\"] to [\"users:read\"]\ndefine r1: AccessRequest as AccessRequest(user_id=1, resource=\"billing\", action=\"write\")\ndefine d1: Decision as check_permission(r1, users, role_perms)\nprint d1.allowed, d1.reason\ndefine r2: AccessRequest as AccessRequest(user_id=2, resource=\"billing\", action=\"write\")\ndefine d2: Decision as check_permission(r2, users, role_perms)\nprint d2.allowed, d2.reason\ndefine r3: AccessRequest as AccessRequest(user_id=2, resource=\"billing\", action=\"read\")\ndefine d3: Decision as check_permission(r3, users, role_perms)\nprint d3.allowed, d3.reason\ndefine r4: AccessRequest as AccessRequest(user_id=999, resource=\"users\", action=\"read\")\ndefine d4: Decision as check_permission(r4, users, role_perms)\nprint d4.allowed, d4.reason",
