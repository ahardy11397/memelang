      "canonical_meme": "record CliInvocation:\n    argc: Int\n    mode: String\n    target_env: String\nfunction parse_cli(argc: Int) -> CliInvocation:\n    if argc > 2:\n        return CliInvocation(argc=argc, mode=argument 1, target_env=argument 2)\n    if argc == 2:\n        return CliInvocation(argc=argc, mode=argument 1, target_env=\"staging\")\n    return CliInvocation(argc=argc, mode=\"status\", target_env=\"local\")\ndefine inv: CliInvocation as parse_cli(argument count)\ndefine prog_name: String as argument 0\ndefine has_prog: Bool as length of string prog_name > 0\nprint \"argc\", inv.argc, \"has_prog\", has_prog, \"mode\", inv.mode, \"env\", inv.target_env",
