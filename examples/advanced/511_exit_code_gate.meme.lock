      "canonical_meme": "record CheckReport:\n    service: String\n    errors: Int\n    warnings: Int\nfunction evaluate_gate(report: CheckReport) -> String:\n    if report.errors < 0:\n        exit with code 3\n    if report.errors > 0:\n        return \"BLOCKED\"\n    if report.warnings > 0:\n        return \"WARN\"\n    return \"PASS\"\ndefine r1: CheckReport as CheckReport(service=\"auth-gateway\", errors=0, warnings=0)\ndefine r2: CheckReport as CheckReport(service=\"payment-worker\", errors=0, warnings=2)\nprint r1.service, evaluate_gate(r1)\nprint r2.service, evaluate_gate(r2)\nexit with code 0\nprint \"unreachable\"",
