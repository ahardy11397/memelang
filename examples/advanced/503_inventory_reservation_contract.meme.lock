      "canonical_meme": "record StockReservation:\n    order_id: String\n    sku: String\n    quantity: Int\nrecord ReservationResult:\n    order_id: String\n    sku: String\n    reserved: Bool\n    allocated_qty: Int\n    remaining_stock: Int\nfunction attempt_reservation(req: StockReservation, catalog_stock: Map<String, Int>) -> ReservationResult:\n    if catalog_stock has key req.sku:\n        define available: Int as catalog_stock[req.sku]\n        if available >= req.quantity:\n            define rem: Int as available - req.quantity\n            return ReservationResult(order_id=req.order_id, sku=req.sku, reserved=true, allocated_qty=req.quantity, remaining_stock=rem)\n        else:\n            return ReservationResult(order_id=req.order_id, sku=req.sku, reserved=false, allocated_qty=0, remaining_stock=available)\n    else:\n        return ReservationResult(order_id=req.order_id, sku=req.sku, reserved=false, allocated_qty=0, remaining_stock=0)\ndefine stock: Map<String, Int> as {\"SKU-A\": 50, \"SKU-B\": 5}\ndefine req1: StockReservation as StockReservation(order_id=\"ord_1001\", sku=\"SKU-A\", quantity=20)\ndefine res1: ReservationResult as attempt_reservation(req1, stock)\nprint res1.order_id, res1.sku, res1.reserved, res1.allocated_qty, res1.remaining_stock\nset stock[res1.sku] to res1.remaining_stock\ndefine req2: StockReservation as StockReservation(order_id=\"ord_1002\", sku=\"SKU-B\", quantity=10)\ndefine res2: ReservationResult as attempt_reservation(req2, stock)\nprint res2.order_id, res2.sku, res2.reserved, res2.allocated_qty, res2.remaining_stock\ndefine req3: StockReservation as StockReservation(order_id=\"ord_1003\", sku=\"SKU-A\", quantity=30)\ndefine res3: ReservationResult as attempt_reservation(req3, stock)\nprint res3.order_id, res3.sku, res3.reserved, res3.allocated_qty, res3.remaining_stock\nset stock[res3.sku] to res3.remaining_stock\ndefine req4: StockReservation as StockReservation(order_id=\"ord_1004\", sku=\"SKU-Z\", quantity=5)\ndefine res4: ReservationResult as attempt_reservation(req4, stock)\nprint res4.order_id, res4.sku, res4.reserved, res4.allocated_qty, res4.remaining_stock\nprint stock",
