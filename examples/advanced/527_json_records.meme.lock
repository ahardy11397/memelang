      "canonical_meme": "record Item:\n    id: Int\n    sku: String\n    price: Float\n    in_stock: Bool\nwrite file \"tmp_527_single.json\" with \"{\\\"id\\\": 101, \\\"sku\\\": \\\"WIDGET-A\\\", \\\"price\\\": 19.95, \\\"in_stock\\\": true}\"\nwrite file \"tmp_527_list.json\" with \"[{\\\"id\\\": 101, \\\"sku\\\": \\\"WIDGET-A\\\", \\\"price\\\": 19.95, \\\"in_stock\\\": true}, {\\\"id\\\": 102, \\\"sku\\\": \\\"GADGET-B\\\", \\\"price\\\": 49.5, \\\"in_stock\\\": false}]\"\nwrite file \"tmp_527_bad.json\" with \"{ invalid json\"\ndefine item_opt: Optional<Item> as read json record Item from file \"tmp_527_single.json\" or else nothing\nif item_opt is nothing:\n    print \"single: nothing\"\nelse:\n    define item: Item as value of item_opt\n    print \"single item:\", item.id, item.sku, format item.price with 2 decimals, item.in_stock\ndefine items_opt: Optional<List<Item>> as read json records Item from file \"tmp_527_list.json\" or else nothing\nif items_opt is nothing:\n    print \"list: nothing\"\nelse:\n    define list items as value of items_opt\n    for each itm in items:\n        print \"list item:\", itm.id, itm.sku, format itm.price with 2 decimals, itm.in_stock\ndefine bad_opt: Optional<Item> as read json record Item from file \"tmp_527_bad.json\" or else nothing\nif bad_opt is nothing:\n    print \"bad file: returned nothing\"\ndefine missing_opt: Optional<Item> as read json record Item from file \"nonexistent_527.json\" or else nothing\nif missing_opt is nothing:\n    print \"nonexistent: returned nothing\"\ndelete file \"tmp_527_single.json\"\ndelete file \"tmp_527_list.json\"\ndelete file \"tmp_527_bad.json\"",
