      "canonical_meme": "record ServiceProbe:\n    service_name: String\n    is_up: Bool\n    latency_ms: Int\nrecord HealthSummary:\n    overall_status: String\n    total_services: Int\n    unhealthy_count: Int\n    max_latency_ms: Int\nfunction evaluate_health(probes: List<ServiceProbe>) -> HealthSummary:\n    define total: Int as 0\n    define unhealthy: Int as 0\n    define peak_latency: Int as 0\n    for each probe in probes:\n        set total to total + 1\n        if not probe.is_up:\n            set unhealthy to unhealthy + 1\n        if probe.latency_ms > peak_latency:\n            set peak_latency to probe.latency_ms\n    define status: String as \"HEALTHY\"\n    if unhealthy == 0:\n        if peak_latency > 500:\n            set status to \"DEGRADED\"\n        else:\n            set status to \"HEALTHY\"\n    else:\n        if unhealthy == total:\n            set status to \"DOWN\"\n        else:\n            set status to \"PARTIAL_OUTAGE\"\n    return HealthSummary(overall_status=status, total_services=total, unhealthy_count=unhealthy, max_latency_ms=peak_latency)\ndefine p1: ServiceProbe as ServiceProbe(service_name=\"primary-db\", is_up=true, latency_ms=15)\ndefine p2: ServiceProbe as ServiceProbe(service_name=\"redis-cache\", is_up=true, latency_ms=4)\ndefine p3: ServiceProbe as ServiceProbe(service_name=\"auth-service\", is_up=true, latency_ms=35)\ndefine h1: HealthSummary as evaluate_health([p1, p2, p3])\nprint h1.overall_status, h1.total_services, h1.unhealthy_count, h1.max_latency_ms\ndefine p4: ServiceProbe as ServiceProbe(service_name=\"primary-db\", is_up=true, latency_ms=750)\ndefine p5: ServiceProbe as ServiceProbe(service_name=\"redis-cache\", is_up=true, latency_ms=10)\ndefine h2: HealthSummary as evaluate_health([p4, p5])\nprint h2.overall_status, h2.total_services, h2.unhealthy_count, h2.max_latency_ms\ndefine p6: ServiceProbe as ServiceProbe(service_name=\"primary-db\", is_up=true, latency_ms=20)\ndefine p7: ServiceProbe as ServiceProbe(service_name=\"redis-cache\", is_up=false, latency_ms=0)\ndefine h3: HealthSummary as evaluate_health([p6, p7])\nprint h3.overall_status, h3.total_services, h3.unhealthy_count, h3.max_latency_ms\ndefine p8: ServiceProbe as ServiceProbe(service_name=\"primary-db\", is_up=false, latency_ms=0)\ndefine p9: ServiceProbe as ServiceProbe(service_name=\"redis-cache\", is_up=false, latency_ms=0)\ndefine h4: HealthSummary as evaluate_health([p8, p9])\nprint h4.overall_status, h4.total_services, h4.unhealthy_count, h4.max_latency_ms",
