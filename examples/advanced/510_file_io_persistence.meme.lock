      "canonical_meme": "record AuditEntry:\n    actor: String\n    action: String\n    status: String\nfunction format_entry(entry: AuditEntry) -> String:\n    return entry.actor + \"|\" + entry.action + \"|\" + entry.status + \"\\n\"\ndefine log_path: String as \"audit_state.log\"\nprint \"initial_exists\", file exists log_path\ndefine e1: AuditEntry as AuditEntry(actor=\"alice\", action=\"deploy_prod\", status=\"OK\")\nwrite file log_path with format_entry(e1)\nprint \"after_write_exists\", file exists log_path\ndefine e2: AuditEntry as AuditEntry(actor=\"bob\", action=\"rotate_keys\", status=\"OK\")\nappend format_entry(e2) to file log_path\ndefine e3: AuditEntry as AuditEntry(actor=\"eve\", action=\"drop_table\", status=\"DENIED\")\nappend format_entry(e3) to file log_path\ndefine saved_log: String as read string from file log_path\nprint \"log_length\", length of string saved_log\nprint saved_log\nwrite file log_path with \"RESET\\n\"\ndefine after_overwrite: String as read string from file log_path\nprint after_overwrite",
