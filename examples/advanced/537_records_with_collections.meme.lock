      "canonical_meme": "record TreeNode:\n    name: String\n    weight: Int\n    tags: Set<String>\n    metadata: Map<String, Int>\n    children: List<TreeNode>\n    parent_name: Optional<String>\nfunction count_subtree(node: TreeNode) -> Int:\n    define count: Int as 1\n    for each child in node.children:\n        set count to count + count_subtree(child)\n    return count\nfunction total_weight(node: TreeNode) -> Int:\n    define total: Int as node.weight\n    for each child in node.children:\n        set total to total + total_weight(child)\n    return total\ndefine list empty_nodes as empty List<TreeNode>\ndefine leaf_a_tags as empty set of String\nadd \"ui\" to set leaf_a_tags\nadd \"frontend\" to set leaf_a_tags\ndefine leaf_a_meta: Map<String, Int> as {\"depth\": 2, \"priority\": 1}\ndefine leaf_a: TreeNode as TreeNode(name=\"Button\", weight=10, tags=leaf_a_tags, metadata=leaf_a_meta, children=empty_nodes, parent_name=optional \"Panel\")\ndefine leaf_b_tags as empty set of String\nadd \"ui\" to set leaf_b_tags\nadd \"text\" to set leaf_b_tags\ndefine leaf_b_meta: Map<String, Int> as {\"depth\": 2, \"priority\": 2}\ndefine leaf_b: TreeNode as TreeNode(name=\"Label\", weight=5, tags=leaf_b_tags, metadata=leaf_b_meta, children=empty_nodes, parent_name=optional \"Panel\")\ndefine panel_tags as empty set of String\nadd \"container\" to set panel_tags\nadd \"layout\" to set panel_tags\ndefine panel_meta: Map<String, Int> as {\"depth\": 1}\ndefine panel: TreeNode as TreeNode(name=\"Panel\", weight=20, tags=panel_tags, metadata=panel_meta, children=[leaf_a, leaf_b], parent_name=optional \"Window\")\ndefine root_tags as empty set of String\nadd \"window\" to set root_tags\nadd \"root\" to set root_tags\ndefine root_meta: Map<String, Int> as {\"depth\": 0}\ndefine root: TreeNode as TreeNode(name=\"Window\", weight=50, tags=root_tags, metadata=root_meta, children=[panel], parent_name=nothing)\nprint \"Subtree count:\", count_subtree(root)\nprint \"Total weight:\", total_weight(root)\nprint \"Root has parent:\", root.parent_name is not nothing\nprint \"Panel parent:\", value of panel.parent_name or else \"none\"\nprint \"Panel children count:\", length of panel.children\nprint \"Button priority:\", leaf_a.metadata[\"priority\"]\nprint \"Button has ui tag:\", leaf_a.tags contains \"ui\"",
