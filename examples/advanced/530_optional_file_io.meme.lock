      "canonical_meme": "write file \"tmp_opt_existing_530.txt\" with \"hello world\\nsecond line\"\ndefine s_missing: Optional<String> as read string from file \"tmp_nonexistent_530.txt\" or else nothing\nif s_missing is nothing:\n    print \"missing string is nothing: true\"\nelse:\n    print \"missing string is nothing: false\"\ndefine s_missing_fallback: String as read string from file \"tmp_nonexistent_530.txt\" or else \"default_str\"\nprint \"missing string fallback:\", s_missing_fallback\ndefine s_existing: Optional<String> as read string from file \"tmp_opt_existing_530.txt\" or else nothing\nif s_existing is nothing:\n    print \"existing string is nothing: true\"\nelse:\n    define s_val: String as value of s_existing\n    print \"existing string:\", s_val\ndefine l_missing: Optional<List<String>> as read lines from file \"tmp_nonexistent_530.txt\" or else nothing\nif l_missing is nothing:\n    print \"missing lines is nothing: true\"\nelse:\n    print \"missing lines is nothing: false\"\ndefine l_existing: Optional<List<String>> as read lines from file \"tmp_opt_existing_530.txt\" or else nothing\nif l_existing is nothing:\n    print \"existing lines is nothing: true\"\nelse:\n    define list lines_val as value of l_existing\n    for each line in lines_val:\n        print \"line:\", line\nwrite file \"tmp_opt_valid_530.json\" with \"[10, 20, 30]\"\ndefine j_valid: Optional<List<Int>> as read json file \"tmp_opt_valid_530.json\" as List<Int> or else nothing\nif j_valid is nothing:\n    print \"valid json is nothing: true\"\nelse:\n    define list nums as value of j_valid\n    for each n in nums:\n        print \"num:\", n\ndefine j_missing: Optional<List<Int>> as read json file \"tmp_nonexistent_530.json\" as List<Int> or else nothing\nif j_missing is nothing:\n    print \"missing json is nothing: true\"\nelse:\n    print \"missing json is nothing: false\"\ndelete file \"tmp_opt_existing_530.txt\"\ndelete file \"tmp_opt_valid_530.json\"",
