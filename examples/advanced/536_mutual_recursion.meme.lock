      "canonical_meme": "function is_even(n: Int) -> Bool:\n    if n == 0:\n        return true\n    return is_odd(n - 1)\nfunction is_odd(n: Int) -> Bool:\n    if n == 0:\n        return false\n    return is_even(n - 1)\nprint \"0 is even:\", is_even(0)\nprint \"0 is odd:\", is_odd(0)\nprint \"4 is even:\", is_even(4)\nprint \"4 is odd:\", is_odd(4)\nprint \"7 is even:\", is_even(7)\nprint \"7 is odd:\", is_odd(7)",
