      "canonical_meme": "use math_ops\nrecord Point:\n    x: Int\n    y: Int\nfunction make_point(x: Int, y: Int) -> Point:\n    return Point(x=x, y=y)\nfunction distance_squared(p: Point) -> Int:\n    define sx: Int as square(p.x)\n    define sy: Int as square(p.y)\n    return add(sx, sy)\nfunction manhattan_distance(p: Point) -> Int:\n    return add(p.x, p.y)",
