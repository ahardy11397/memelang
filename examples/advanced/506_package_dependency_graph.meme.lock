      "canonical_meme": "record ResolutionPlan:\n    target: String\n    valid_package: Bool\n    missing_count: Int\n    to_install: List<String>\nfunction plan_installation(pkg: String, registry: Map<String, List<String>>, installed: Map<String, Bool>) -> ResolutionPlan:\n    if registry has key pkg:\n        define list direct_deps as registry[pkg]\n        define list missing as empty List<String>\n        define count: Int as 0\n        for each dep in direct_deps:\n            define is_inst: Bool as installed[dep] default false\n            if not is_inst:\n                append dep to missing\n                set count to count + 1\n        return ResolutionPlan(target=pkg, valid_package=true, missing_count=count, to_install=missing)\n    else:\n        define list empty_list as empty List<String>\n        return ResolutionPlan(target=pkg, valid_package=false, missing_count=0, to_install=empty_list)\ndefine registry: Map<String, List<String>> as empty Map<String, List<String>>\nset registry[\"web-service\"] to [\"database\", \"auth-lib\", \"logging\"]\nset registry[\"worker-job\"] to [\"queue-client\", \"logging\"]\nset registry[\"auth-lib\"] to [\"crypto-core\"]\ndefine installed: Map<String, Bool> as empty Map<String, Bool>\nset installed[\"logging\"] to true\nset installed[\"crypto-core\"] to true\ndefine p1: ResolutionPlan as plan_installation(\"web-service\", registry, installed)\nprint p1.target, p1.valid_package, p1.missing_count, p1.to_install\ndefine p2: ResolutionPlan as plan_installation(\"worker-job\", registry, installed)\nprint p2.target, p2.valid_package, p2.missing_count, p2.to_install\nset installed[\"database\"] to true\nset installed[\"auth-lib\"] to true\ndefine p3: ResolutionPlan as plan_installation(\"web-service\", registry, installed)\nprint p3.target, p3.valid_package, p3.missing_count, p3.to_install\ndefine p4: ResolutionPlan as plan_installation(\"non-existent-lib\", registry, installed)\nprint p4.target, p4.valid_package, p4.missing_count, p4.to_install",
