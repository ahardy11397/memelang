      "canonical_meme": "record PipelineConfig:\n    run_name: String\n    max_retries: Int\n    output_path: String\nfunction resolve_output_path(cli_override: Optional<String>, fallback: String) -> String:\n    return value of cli_override or else fallback\nfunction make_config(argc: Int) -> PipelineConfig:\n    define name: String as \"pipeline_run\"\n    define cli_path: Optional<String> as nothing\n    if argc > 1:\n        set cli_path to optional (argument 1)\n    define out_file: String as resolve_output_path(cli_path, \"pipeline_default.txt\")\n    return PipelineConfig(run_name=name, max_retries=3, output_path=out_file)\ndefine cfg: PipelineConfig as make_config(argument count)\nprint \"run_name:\", cfg.run_name\nprint \"max_retries:\", cfg.max_retries\nprint \"output_path:\", cfg.output_path\nwrite file cfg.output_path with \"STATUS=INITIALIZED\\n\"\nprint \"file_exists_before:\", file exists cfg.output_path\nappend \"STATUS=COMPLETED\\n\" to file cfg.output_path\ndefine contents: String as read string from file cfg.output_path\ndefine trimmed: String as trim contents\ndefine list lines as split trimmed by \"\\n\"\nprint \"lines_count:\", length of lines\nfor each index i item line in lines:\n    print i, line\ndefine clean_opt: Optional<String> as optional \"success\"\nif clean_opt is not nothing:\n    print \"final_status:\", value of clean_opt",
