      "canonical_meme": "function adjust_balance(initial: Int, bonus: Int, penalty: Int) -> Int:\n    define total: Int as initial\n    add bonus to total\n    subtract penalty from total\n    multiply total by 3\n    divide total by 2\n    return total\ndefine score: Int as adjust_balance(10, 5, 3)\nprint \"Adjusted score:\", score\ndefine neg_val: Int as -7\ndivide neg_val by 2\nprint \"Truncated negative int div:\", neg_val\ndefine ratio: Float as 12.5\nadd 2.5 to ratio\nsubtract 3.0 from ratio\nmultiply ratio by 1.5\ndivide ratio by 4.0\nprint \"Final ratio:\", ratio",
