      "canonical_meme": "record WebhookPayload:\n    event_id: String\n    topic: String\n    body: String\n    secret_signature: String\nrecord DispatchResult:\n    event_id: String\n    delivered: Bool\n    status_code: Int\n    retry_after_sec: Int\n    endpoint_url: String\nfunction dispatch_event(payload: WebhookPayload, endpoints: Map<String, String>, signatures: Map<String, String>, attempt: Int, mock_status: Int) -> DispatchResult:\n    if endpoints has key payload.topic:\n        define endpoint: String as endpoints[payload.topic]\n        define expected_sig: String as signatures[payload.topic] default \"\"\n        if payload.secret_signature != expected_sig:\n            return DispatchResult(event_id=payload.event_id, delivered=false, status_code=401, retry_after_sec=0, endpoint_url=\"\")\n        else:\n            if mock_status == 200:\n                return DispatchResult(event_id=payload.event_id, delivered=true, status_code=200, retry_after_sec=0, endpoint_url=endpoint)\n            else:\n                define delay: Int as 2 * attempt * attempt\n                return DispatchResult(event_id=payload.event_id, delivered=false, status_code=mock_status, retry_after_sec=delay, endpoint_url=endpoint)\n    else:\n        return DispatchResult(event_id=payload.event_id, delivered=false, status_code=404, retry_after_sec=0, endpoint_url=\"\")\ndefine endpoints: Map<String, String> as empty Map<String, String>\nset endpoints[\"order.created\"] to \"https://billing.internal/webhooks/orders\"\nset endpoints[\"user.deleted\"] to \"https://compliance.internal/webhooks/gdpr\"\ndefine signatures: Map<String, String> as empty Map<String, String>\nset signatures[\"order.created\"] to \"sig_sec_order_99\"\nset signatures[\"user.deleted\"] to \"sig_sec_gdpr_11\"\ndefine ev1: WebhookPayload as WebhookPayload(event_id=\"evt_001\", topic=\"order.created\", body=\"item_id=42\", secret_signature=\"sig_sec_order_99\")\ndefine r1: DispatchResult as dispatch_event(ev1, endpoints, signatures, 1, 200)\nprint r1.event_id, r1.delivered, r1.status_code, r1.retry_after_sec, r1.endpoint_url\ndefine ev2: WebhookPayload as WebhookPayload(event_id=\"evt_002\", topic=\"order.created\", body=\"item_id=42\", secret_signature=\"wrong_tampered_sig\")\ndefine r2: DispatchResult as dispatch_event(ev2, endpoints, signatures, 1, 200)\nprint r2.event_id, r2.delivered, r2.status_code\ndefine ev3: WebhookPayload as WebhookPayload(event_id=\"evt_003\", topic=\"system.reboot\", body=\"code=0\", secret_signature=\"sig_none\")\ndefine r3: DispatchResult as dispatch_event(ev3, endpoints, signatures, 1, 200)\nprint r3.event_id, r3.delivered, r3.status_code\ndefine ev4: WebhookPayload as WebhookPayload(event_id=\"evt_004\", topic=\"user.deleted\", body=\"user=7\", secret_signature=\"sig_sec_gdpr_11\")\ndefine r4: DispatchResult as dispatch_event(ev4, endpoints, signatures, 2, 503)\nprint r4.event_id, r4.delivered, r4.status_code, r4.retry_after_sec, r4.endpoint_url",
