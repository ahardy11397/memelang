      "canonical_meme": "function get_config_key(line: String) -> String:\n    define line_len: Int as length of string line\n    define key_buf: String as \"\"\n    for idx from 0 to line_len - 1:\n        define ch: String as slice line from idx to idx + 1\n        if ch == \"=\":\n            return key_buf\n        set key_buf to key_buf + ch\n    return key_buf\ndefine directive: String as \"max_connections=500\"\ndefine key_name: String as get_config_key(directive)\nprint \"Config key name:\", key_name",
