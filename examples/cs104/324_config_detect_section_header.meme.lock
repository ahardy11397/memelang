      "canonical_meme": "function is_section_header(line: String) -> Bool:\n    define sz: Int as length of string line\n    if sz >= 2:\n        define start_ch: String as slice line from 0 to 1\n        define end_ch: String as slice line from sz - 1 to sz\n        if start_ch == \"[\":\n            if end_ch == \"]\":\n                return true\n    return false\ndefine header_line: String as \"[database_cluster]\"\ndefine normal_line: String as \"host=localhost\"\nprint \"Is header 1:\", is_section_header(header_line)\nprint \"Is header 2:\", is_section_header(normal_line)",
