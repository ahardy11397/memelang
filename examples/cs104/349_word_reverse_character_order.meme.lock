      "canonical_meme": "function reverse_string(orig: String) -> String:\n    define n: Int as length of string orig\n    define rev: String as \"\"\n    for i from 0 to n - 1:\n        define ch: String as slice orig from n - 1 - i to n - i\n        set rev to rev + ch\n    return rev\ndefine backwards: String as reverse_string(\"stressed\")\nprint \"Backwards word:\", backwards",
