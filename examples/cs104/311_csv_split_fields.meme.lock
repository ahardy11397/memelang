      "canonical_meme": "define csv_line: String as \"alice,developer,seattle\"\ndefine list fields as empty List<String>\ndefine current_field: String as \"\"\ndefine n: Int as length of string csv_line\nfor i from 0 to n - 1:\n    define ch: String as slice csv_line from i to i + 1\n    if ch == \",\":\n        append current_field to fields\n        set current_field to \"\"\n    else:\n        set current_field to current_field + ch\nappend current_field to fields\nprint \"Field count:\", length of fields\nprint \"First field:\", fields[0]",
