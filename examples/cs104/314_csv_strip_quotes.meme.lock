      "canonical_meme": "function clean_quoted_field(raw: String) -> String:\n    define len_raw: Int as length of string raw\n    if len_raw >= 2:\n        define first_ch: String as slice raw from 0 to 1\n        define last_ch: String as slice raw from len_raw - 1 to len_raw\n        if first_ch == \"'\":\n            if last_ch == \"'\":\n                return slice raw from 1 to len_raw - 1\n    return raw\ndefine sample: String as \"'san francisco'\"\ndefine cleaned: String as clean_quoted_field(sample)\nprint \"Unquoted field:\", cleaned",
