      "canonical_meme": "function strip_char(src: String, bad_c: String) -> String:\n    define n: Int as length of string src\n    define clean_buf: String as \"\"\n    for i from 0 to n - 1:\n        define ch: String as slice src from i to i + 1\n        if ch != bad_c:\n            set clean_buf to clean_buf + ch\n    return clean_buf\ndefine phone: String as \"555-019-2834\"\ndefine digits_only: String as strip_char(phone, \"-\")\nprint \"Stripped phone digits:\", digits_only",
