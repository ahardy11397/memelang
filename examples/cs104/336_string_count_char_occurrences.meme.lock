      "canonical_meme": "function count_char(blob: String, target_c: String) -> Int:\n    define n: Int as length of string blob\n    define occurrences: Int as 0\n    for i from 0 to n - 1:\n        define ch: String as slice blob from i to i + 1\n        if ch == target_c:\n            set occurrences to occurrences + 1\n    return occurrences\ndefine path_str: String as \"/usr/local/bin/python3\"\ndefine slash_count: Int as count_char(path_str, \"/\")\nprint \"Directory depth count:\", slash_count",
