      "canonical_meme": "function truncate_with_ellipsis(message: String, max_len: Int) -> String:\n    define msg_len: Int as length of string message\n    if msg_len > max_len:\n        define truncated: String as slice message from 0 to max_len - 3\n        return truncated + \"...\"\n    return message\ndefine long_title: String as \"Comprehensive Architectural Overview of Distributed Storage\"\ndefine short_view: String as truncate_with_ellipsis(long_title, 20)\nprint \"Truncated overview:\", short_view",
