      "canonical_meme": "function is_palindrome(text: String) -> Bool:\n    define n: Int as length of string text\n    for i from 0 to n - 1:\n        define front_c: String as slice text from i to i + 1\n        define back_c: String as slice text from n - 1 - i to n - i\n        if front_c != back_c:\n            return false\n    return true\ndefine is_pal1: Bool as is_palindrome(\"radar\")\ndefine is_pal2: Bool as is_palindrome(\"rocket\")\nprint \"Radar palindrome check:\", is_pal1\nprint \"Rocket palindrome check:\", is_pal2",
