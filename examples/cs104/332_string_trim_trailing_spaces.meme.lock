      "canonical_meme": "function rtrim(text: String) -> String:\n    define n: Int as length of string text\n    define last_non_space: Int as 0\n    for i from 0 to n - 1:\n        define ch: String as slice text from i to i + 1\n        if ch != \" \":\n            set last_non_space to i + 1\n    return slice text from 0 to last_non_space\ndefine raw: String as \"server_output   \"\ndefine trimmed: String as rtrim(raw)\nprint \"Right trimmed text:\", trimmed",
