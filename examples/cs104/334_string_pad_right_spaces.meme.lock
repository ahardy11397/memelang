      "canonical_meme": "function pad_right(label: String, width: Int) -> String:\n    define cur_len: Int as length of string label\n    define padded: String as label\n    define diff: Int as width - cur_len\n    if diff > 0:\n        for s from 1 to diff:\n            set padded to padded + \" \"\n    return padded\ndefine formatted: String as pad_right(\"TOTAL\", 10)\nprint \"Formatted label width:\", length of string formatted\nprint \"Padded output tag:\", formatted + \"<END>\"",
