      "canonical_meme": "function ltrim(text: String) -> String:\n    define n: Int as length of string text\n    define start_idx: Int as 0\n    define skipping: Bool as true\n    for i from 0 to n - 1:\n        define ch: String as slice text from i to i + 1\n        if skipping:\n            if ch != \" \":\n                set start_idx to i\n                set skipping to false\n    return slice text from start_idx to n\ndefine raw: String as \"   payload content\"\ndefine trimmed: String as ltrim(raw)\nprint \"Left trimmed text:\", trimmed",
