      "canonical_meme": "function parse_two_digit_int(digits: String) -> Int:\n    define d0: String as slice digits from 0 to 1\n    define d1: String as slice digits from 1 to 2\n    define tens: Int as 0\n    define ones: Int as 0\n    if d0 == \"3\":\n        set tens to 30\n    if d0 == \"6\":\n        set tens to 60\n    if d1 == \"5\":\n        set ones to 5\n    return tens + ones\ndefine timeout_sec: Int as parse_two_digit_int(\"35\")\nprint \"Timeout in seconds:\", timeout_sec",
