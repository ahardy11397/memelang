      "canonical_meme": "function render_progress_bar(completed: Int, total_steps: Int) -> String:\n    define bar: String as \"[\"\n    for s from 1 to total_steps:\n        if s <= completed:\n            set bar to bar + \"#\"\n        else:\n            set bar to bar + \"-\"\n    return bar + \"]\"\ndefine meter: String as render_progress_bar(7, 10)\nprint \"Rendered progress bar:\", meter",
