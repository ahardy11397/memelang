      "canonical_meme": "function find_first(haystack: String, needle: String) -> Int:\n    define n: Int as length of string haystack\n    for i from 0 to n - 1:\n        define ch: String as slice haystack from i to i + 1\n        if ch == needle:\n            return i\n    return -1\ndefine at_pos: Int as find_first(\"support@company.org\", \"@\")\nprint \"At symbol index:\", at_pos",
