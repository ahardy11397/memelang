      "canonical_meme": "function quote_if_comma_present(field_text: String) -> String:\n    define text_len: Int as length of string field_text\n    define has_delimiter: Bool as false\n    for pos from 0 to text_len - 1:\n        define ch: String as slice field_text from pos to pos + 1\n        if ch == \",\":\n            set has_delimiter to true\n    if has_delimiter:\n        return \"'\" + field_text + \"'\"\n    return field_text\ndefine f1: String as quote_if_comma_present(\"standard_val\")\ndefine f2: String as quote_if_comma_present(\"smith, john\")\nprint \"Field 1 escaped:\", f1\nprint \"Field 2 escaped:\", f2",
      "ir": {
