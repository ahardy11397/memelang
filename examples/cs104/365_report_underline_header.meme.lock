      "canonical_meme": "function underline_text(hdr: String) -> String:\n    define n: Int as length of string hdr\n    define line: String as \"\"\n    for i from 1 to n:\n        set line to line + \"-\"\n    return line\ndefine title_text: String as \"Account Summary\"\ndefine underline: String as underline_text(title_text)\nprint \"Header title text:\", title_text\nprint \"Header underline line:\", underline",
