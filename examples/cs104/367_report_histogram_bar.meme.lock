      "canonical_meme": "function make_bar(label: String, magnitude: Int) -> String:\n    define bar_str: String as label + \" | \"\n    for step from 1 to magnitude:\n        set bar_str to bar_str + \"*\"\n    return bar_str\ndefine chart_row: String as make_bar(\"HTTP 200\", 8)\nprint \"Histogram chart row:\", chart_row",
