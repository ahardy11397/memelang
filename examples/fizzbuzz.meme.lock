      "canonical_meme": "function is_divisible(n: Int, d: Int) -> Bool:\n    return n % d == 0\nfor i from 1 to 20:\n    if is_divisible(i, 15):\n        print \"FizzBuzz\"\n    else:\n        if is_divisible(i, 3):\n            print \"Fizz\"\n        else:\n            if is_divisible(i, 5):\n                print \"Buzz\"\n            else:\n                print i",
