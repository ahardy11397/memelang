      "canonical_meme": "function countdown_remaining(total_mins: Int, elapsed_mins: Int) -> Int:\n    define rem: Int as total_mins - elapsed_mins\n    if rem < 0:\n        return 0\n    return rem\ndefine left: Int as countdown_remaining(60, 42)\nprint \"Minutes remaining on timer:\", left",
