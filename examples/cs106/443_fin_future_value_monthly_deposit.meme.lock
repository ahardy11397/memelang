      "canonical_meme": "function savings_with_deposit(monthly_dep: Int, months: Int) -> Int:\n    define accumulated: Int as 0\n    for m from 1 to months:\n        set accumulated to accumulated + monthly_dep\n    return accumulated\ndefine saved: Int as savings_with_deposit(250, 12)\nprint \"Annual savings accumulation:\", saved",
