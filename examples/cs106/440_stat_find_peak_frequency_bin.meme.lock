      "canonical_meme": "function highest_frequency_bin(bins: List<Int>) -> Int:\n    define best_idx: Int as 0\n    define max_count: Int as bins[0]\n    define n: Int as length of bins\n    for i from 1 to n - 1:\n        if bins[i] > max_count:\n            set max_count to bins[i]\n            set best_idx to i\n    return best_idx\ndefine list bin_counts as [12, 45, 98, 23, 10]\ndefine peak_bin: Int as highest_frequency_bin(bin_counts)\nprint \"Peak frequency bin index:\", peak_bin",
