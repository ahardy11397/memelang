      "canonical_meme": "function compute_mean(data: List<Int>) -> Int:\n    define total: Int as 0\n    for each x in data:\n        set total to total + x\n    return total / length of data\ndefine list samples as [10, 20, 30, 40, 50]\ndefine avg: Int as compute_mean(samples)\nprint \"Calculated dataset mean:\", avg",
