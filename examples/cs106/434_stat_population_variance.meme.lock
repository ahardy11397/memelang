      "canonical_meme": "function variance_approx(vals: List<Int>, avg: Int) -> Int:\n    define sum_sq_diff: Int as 0\n    for each v in vals:\n        define diff: Int as v - avg\n        set sum_sq_diff to sum_sq_diff + diff * diff\n    return sum_sq_diff / length of vals\ndefine list observations as [10, 20, 30]\ndefine var_val: Int as variance_approx(observations, 20)\nprint \"Population variance approx:\", var_val",
