      "canonical_meme": "function add_mins(h: Int, m: Int, delta_m: Int) -> Int:\n    define total_m: Int as h * 60 + m + delta_m\n    define new_h: Int as total_m / 60 % 24\n    return new_h\ndefine later_hour: Int as add_mins(22, 30, 120)\nprint \"Later hour result:\", later_hour",
