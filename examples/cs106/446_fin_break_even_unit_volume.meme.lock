      "canonical_meme": "function break_even_volume(fixed_costs: Int, unit_price: Int, unit_cost: Int) -> Int:\n    define margin_per_unit: Int as unit_price - unit_cost\n    return fixed_costs / margin_per_unit\ndefine be_units: Int as break_even_volume(20000, 50, 30)\nprint \"Break-even unit volume:\", be_units",
