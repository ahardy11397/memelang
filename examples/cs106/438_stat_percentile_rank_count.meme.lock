      "canonical_meme": "function percentile_rank_int(scores: List<Int>, threshold: Int) -> Int:\n    define below_count: Int as 0\n    for each s in scores:\n        if s < threshold:\n            set below_count to below_count + 1\n    return below_count * 100 / length of scores\ndefine list exam_scores as [50, 60, 70, 80, 90]\ndefine rank: Int as percentile_rank_int(exam_scores, 80)\nprint \"Percentile rank of 80:\", rank",
