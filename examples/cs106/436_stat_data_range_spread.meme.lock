      "canonical_meme": "function data_spread(arr: List<Int>) -> Int:\n    sort arr ascending\n    define n: Int as length of arr\n    define min_v: Int as arr[0]\n    define max_v: Int as arr[n - 1]\n    return max_v - min_v\ndefine list measures as [5, 12, 3, 22, 9]\ndefine spread: Int as data_spread(measures)\nprint \"Dataset range spread:\", spread",
