      "canonical_meme": "function median_even(items: List<Int>) -> Int:\n    sort items ascending\n    define n: Int as length of items\n    define mid_right: Int as n / 2\n    define mid_left: Int as mid_right - 1\n    return (items[mid_left] + items[mid_right]) / 2\ndefine list dataset as [10, 20, 30, 40]\ndefine med_e: Int as median_even(dataset)\nprint \"Calculated even median:\", med_e",
