      "canonical_meme": "function backoff_delay_ms(base_ms: Int, attempt: Int) -> Int:\n    define delay: Int as base_ms\n    if attempt > 1:\n        for a from 2 to attempt:\n            set delay to delay * 2\n    return delay\ndefine d1: Int as backoff_delay_ms(100, 1)\ndefine d3: Int as backoff_delay_ms(100, 3)\nprint \"Backoff attempt 1 ms:\", d1\nprint \"Backoff attempt 3 ms:\", d3",
