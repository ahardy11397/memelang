      "canonical_meme": "function tier_discount_pct(cart_amt: Int) -> Int:\n    if cart_amt >= 200:\n        return 20\n    if cart_amt >= 100:\n        return 10\n    if cart_amt >= 50:\n        return 5\n    return 0\nprint \"Tier discount 250:\", tier_discount_pct(250)\nprint \"Tier discount 120:\", tier_discount_pct(120)\nprint \"Tier discount 30:\", tier_discount_pct(30)",
