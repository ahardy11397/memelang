      "canonical_meme": "function estimate_monthly_loan(amount: Int, months: Int, service_fee: Int) -> Int:\n    define base_monthly: Int as amount / months\n    return base_monthly + service_fee\ndefine monthly: Int as estimate_monthly_loan(12000, 24, 15)\nprint \"Estimated monthly installment:\", monthly",
