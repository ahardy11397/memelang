      "canonical_meme": "define out_file: String as \"examples/524_build/demo_output.txt\"\ndefine before_exists: Bool as file exists out_file\nprint \"before_exists\", before_exists\ndefine arg_count: Int as argument count\ndefine has_args: Bool as arg_count >= 1\nprint \"has_args\", has_args\nwrite file out_file with \"status=ok\"\nappend \"\\nphase=3a\\n\" to file out_file\ndefine saved_text: String as read string from file out_file\nprint \"file_content:\"\nprint saved_text\ndefine after_exists: Bool as file exists out_file\nprint \"after_exists\", after_exists\ndelete file out_file\ndefine final_exists: Bool as file exists out_file\nprint \"cleaned_up\", not final_exists\nexit with code 0",
