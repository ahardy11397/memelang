      "canonical_meme": "function find_largest(nums: List<Int>) -> Int:\n    define largest: Int as nums[0]\n    for each n in nums:\n        if n > largest:\n            set largest to n\n    return largest\ndefine filepath: String as read String with prompt \"\"\ndefine numbers_opt: Optional<List<Int>> as read json file filepath as List<Int> or else nothing\ndefine list fallback_numbers as empty List<Int>\ndefine list numbers as value of numbers_opt or else fallback_numbers\nif length of numbers > 0:\n    print find_largest(numbers)\nelse:\n    print \"no numbers found\"",
