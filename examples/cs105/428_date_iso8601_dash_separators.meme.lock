      "canonical_meme": "function has_iso_date_separators(d: String) -> Bool:\n    define n: Int as length of string d\n    if n == 10:\n        define sep1: String as slice d from 4 to 5\n        define sep2: String as slice d from 7 to 8\n        if sep1 == \"-\":\n            if sep2 == \"-\":\n                return true\n    return false\ndefine test_d: String as \"2026-05-15\"\nprint \"ISO date dash separators valid:\", has_iso_date_separators(test_d)",
