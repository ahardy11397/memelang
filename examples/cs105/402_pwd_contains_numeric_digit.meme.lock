      "canonical_meme": "function has_digit(pwd: String) -> Bool:\n    define n: Int as length of string pwd\n    for i from 0 to n - 1:\n        define ch: String as slice pwd from i to i + 1\n        if ch == \"0\":\n            return true\n        if ch == \"1\":\n            return true\n        if ch == \"2\":\n            return true\n        if ch == \"3\":\n            return true\n        if ch == \"4\":\n            return true\n        if ch == \"5\":\n            return true\n        if ch == \"6\":\n            return true\n        if ch == \"7\":\n            return true\n        if ch == \"8\":\n            return true\n        if ch == \"9\":\n            return true\n    return false\nprint \"Has digit in secret9:\", has_digit(\"secret9\")\nprint \"Has digit in secret:\", has_digit(\"secret\")",
