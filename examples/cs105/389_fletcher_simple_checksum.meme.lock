      "canonical_meme": "function simple_fletcher_sum(data: List<Int>) -> Int:\n    define sum1: Int as 0\n    define sum2: Int as 0\n    for each b in data:\n        set sum1 to (sum1 + b) % 255\n        set sum2 to (sum2 + sum1) % 255\n    return sum1 + sum2\ndefine list chunk as [10, 20, 30, 40]\ndefine f_sum: Int as simple_fletcher_sum(chunk)\nprint \"Fletcher checksum result:\", f_sum",
