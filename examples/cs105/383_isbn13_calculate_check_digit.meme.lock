      "canonical_meme": "function isbn13_check_digit(d: List<Int>) -> Int:\n    define total: Int as 0\n    for i from 0 to 11:\n        if i % 2 == 0:\n            set total to total + d[i]\n        else:\n            set total to total + d[i] * 3\n    define remainder: Int as total % 10\n    if remainder == 0:\n        return 0\n    return 10 - remainder\ndefine list prefix12 as [9, 7, 8, 0, 3, 0, 6, 4, 0, 6, 1, 5]\ndefine cd: Int as isbn13_check_digit(prefix12)\nprint \"Calculated ISBN-13 check digit:\", cd",
