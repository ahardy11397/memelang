      "canonical_meme": "function has_forbidden_chars(s: String) -> Bool:\n    define n: Int as length of string s\n    for i from 0 to n - 1:\n        define ch: String as slice s from i to i + 1\n        if ch == \";\":\n            return true\n        if ch == \":\":\n            return true\n        if ch == \"<\":\n            return true\n        if ch == \">\":\n            return true\n        if ch == \",\":\n            return true\n    return false\nprint \"Forbidden in clean:\", has_forbidden_chars(\"hello@world.com\")\nprint \"Forbidden in bad:\", has_forbidden_chars(\"hello<bad>@world.com\")",
