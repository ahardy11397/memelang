      "canonical_meme": "function days_in_month_standard(m: Int) -> Int:\n    if m == 2:\n        return 28\n    if m == 4:\n        return 30\n    if m == 6:\n        return 30\n    if m == 9:\n        return 30\n    if m == 11:\n        return 30\n    return 31\nprint \"Days in February:\", days_in_month_standard(2)\nprint \"Days in April:\", days_in_month_standard(4)\nprint \"Days in July:\", days_in_month_standard(7)",
