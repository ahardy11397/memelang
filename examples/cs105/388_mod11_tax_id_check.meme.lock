      "canonical_meme": "function verify_mod11(digits: List<Int>, weights: List<Int>, check_val: Int) -> Bool:\n    define n: Int as length of digits\n    define total: Int as 0\n    for i from 0 to n - 1:\n        set total to total + digits[i] * weights[i]\n    define rem: Int as total % 11\n    return rem == check_val\ndefine list id_nums as [2, 7, 1, 8, 2, 8]\ndefine list id_w as [7, 6, 5, 4, 3, 2]\nprint \"Mod 11 valid check:\", verify_mod11(id_nums, id_w, 5)",
