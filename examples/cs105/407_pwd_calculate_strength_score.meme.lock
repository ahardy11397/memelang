      "canonical_meme": "function password_score(pwd: String) -> Int:\n    define score: Int as 0\n    define n: Int as length of string pwd\n    if n >= 8:\n        set score to score + 1\n    if n >= 12:\n        set score to score + 1\n    define has_dig: Bool as false\n    define has_sym: Bool as false\n    for i from 0 to n - 1:\n        define ch: String as slice pwd from i to i + 1\n        if ch == \"1\":\n            set has_dig to true\n        if ch == \"!\":\n            set has_sym to true\n    if has_dig:\n        set score to score + 1\n    if has_sym:\n        set score to score + 1\n    return score\ndefine s1: Int as password_score(\"V3ryLongSecret!1\")\nprint \"Password score result:\", s1",
