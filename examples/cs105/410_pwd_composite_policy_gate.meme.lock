      "canonical_meme": "function passes_all_policies(pwd: String) -> Bool:\n    define n: Int as length of string pwd\n    if n < 8:\n        return false\n    if n > 64:\n        return false\n    define has_num: Bool as false\n    for i from 0 to n - 1:\n        define ch: String as slice pwd from i to i + 1\n        if ch == \" \":\n            return false\n        if ch == \"9\":\n            set has_num to true\n    return has_num\nprint \"Policy gate pass:\", passes_all_policies(\"Str0ngVault9\")\nprint \"Policy gate fail:\", passes_all_policies(\"short\")",
