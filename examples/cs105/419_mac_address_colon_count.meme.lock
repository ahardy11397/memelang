      "canonical_meme": "function is_mac_format(mac: String) -> Bool:\n    define n: Int as length of string mac\n    if n == 17:\n        define colons: Int as 0\n        for i from 0 to n - 1:\n            define ch: String as slice mac from i to i + 1\n            if ch == \":\":\n                set colons to colons + 1\n        return colons == 5\n    return false\ndefine mac_addr: String as \"00:1A:2B:3C:4D:5E\"\nprint \"MAC address format valid:\", is_mac_format(mac_addr)",
