      "canonical_meme": "function is_isbn13_valid(d: List<Int>) -> Bool:\n    define total: Int as 0\n    for i from 0 to 12:\n        if i % 2 == 0:\n            set total to total + d[i]\n        else:\n            set total to total + d[i] * 3\n    return total % 10 == 0\ndefine list code13 as [9, 7, 8, 0, 1, 3, 1, 4, 9, 5, 0, 5, 0]\nprint \"ISBN-13 verification:\", is_isbn13_valid(code13)",
