      "canonical_meme": "function is_uuid_v4(uuid: String) -> Bool:\n    define n: Int as length of string uuid\n    if n == 36:\n        define ver_char: String as slice uuid from 14 to 15\n        return ver_char == \"4\"\n    return false\ndefine u4: String as \"c9a646d3-9c61-4cc9-bc19-4786f4cc40f4\"\nprint \"UUID v4 marker check:\", is_uuid_v4(u4)",
