      "canonical_meme": "function is_clean_slug(slug_str: String) -> Bool:\n    define n: Int as length of string slug_str\n    if n == 0:\n        return false\n    for i from 0 to n - 1:\n        define ch: String as slice slug_str from i to i + 1\n        if ch == \" \":\n            return false\n        if ch == \"_\":\n            return false\n    return true\nprint \"Clean slug 1:\", is_clean_slug(\"article-slug-format\")\nprint \"Clean slug 2:\", is_clean_slug(\"article slug format\")",
