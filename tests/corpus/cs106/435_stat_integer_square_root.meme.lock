      "canonical_meme": "function int_sqrt(n: Int) -> Int:\n    if n <= 0:\n        return 0\n    define root: Int as 1\n    while (root + 1) * (root + 1) <= n:\n        set root to root + 1\n    return root\ndefine s1: Int as int_sqrt(64)\ndefine s2: Int as int_sqrt(66)\nprint \"Int sqrt 64:\", s1\nprint \"Int sqrt 66:\", s2",
