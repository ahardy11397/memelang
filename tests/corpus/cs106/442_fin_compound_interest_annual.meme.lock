      "canonical_meme": "function compound_annual(principal: Int, rate_pct: Int, years: Int) -> Int:\n    define balance: Int as principal\n    for y from 1 to years:\n        define earned: Int as balance * rate_pct / 100\n        set balance to balance + earned\n    return balance\ndefine final_bal: Int as compound_annual(1000, 10, 3)\nprint \"Compounded final balance:\", final_bal",
