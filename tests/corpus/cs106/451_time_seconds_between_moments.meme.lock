      "canonical_meme": "function to_seconds(h: Int, m: Int, s: Int) -> Int:\n    return h * 3600 + m * 60 + s\nfunction elapsed_seconds(h1: Int, m1: Int, s1: Int, h2: Int, m2: Int, s2: Int) -> Int:\n    define t1: Int as to_seconds(h1, m1, s1)\n    define t2: Int as to_seconds(h2, m2, s2)\n    return t2 - t1\ndefine diff_sec: Int as elapsed_seconds(9, 15, 0, 10, 30, 45)\nprint \"Elapsed duration in seconds:\", diff_sec",
