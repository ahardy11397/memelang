      "canonical_meme": "function count_consonants(phrase: String) -> Int:\n    define n: Int as length of string phrase\n    define consonants: Int as 0\n    for i from 0 to n - 1:\n        define ch: String as slice phrase from i to i + 1\n        define is_vowel: Bool as false\n        if ch == \"a\":\n            set is_vowel to true\n        if ch == \"e\":\n            set is_vowel to true\n        if ch == \"i\":\n            set is_vowel to true\n        if ch == \"o\":\n            set is_vowel to true\n        if ch == \"u\":\n            set is_vowel to true\n        if ch == \" \":\n            set is_vowel to true\n        if not is_vowel:\n            set consonants to consonants + 1\n    return consonants\ndefine total_c: Int as count_consonants(\"safe lock\")\nprint \"Total consonants found:\", total_c",
