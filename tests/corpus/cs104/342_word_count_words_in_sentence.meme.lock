      "canonical_meme": "function count_words(sentence: String) -> Int:\n    define n: Int as length of string sentence\n    if n == 0:\n        return 0\n    define spaces: Int as 0\n    for i from 0 to n - 1:\n        define ch: String as slice sentence from i to i + 1\n        if ch == \" \":\n            set spaces to spaces + 1\n    return spaces + 1\ndefine text_sample: String as \"quick brown fox jumps over lazy dog\"\ndefine total_words: Int as count_words(text_sample)\nprint \"Total sentence words:\", total_words",
