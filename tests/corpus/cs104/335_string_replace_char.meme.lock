      "canonical_meme": "function replace_char(source: String, old_c: String, new_c: String) -> String:\n    define len_s: Int as length of string source\n    define result: String as \"\"\n    for idx from 0 to len_s - 1:\n        define cur_c: String as slice source from idx to idx + 1\n        if cur_c == old_c:\n            set result to result + new_c\n        else:\n            set result to result + cur_c\n    return result\ndefine slug: String as replace_char(\"my bad file name\", \" \", \"-\")\nprint \"Transformed slug:\", slug",
