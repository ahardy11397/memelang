      "canonical_meme": "function join_with_comma(parts: List<String>) -> String:\n    define out_line: String as \"\"\n    define cnt: Int as length of parts\n    for idx from 0 to cnt - 1:\n        if idx > 0:\n            set out_line to out_line + \",\"\n        set out_line to out_line + parts[idx]\n    return out_line\ndefine list cells as [\"prod-99\", \"Keyboard\", \"49\", \"In Stock\"]\ndefine serialized: String as join_with_comma(cells)\nprint \"Serialized line:\", serialized",
