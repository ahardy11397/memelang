      "canonical_meme": "function trim_inline_comment(directive_text: String) -> String:\n    define total_len: Int as length of string directive_text\n    define clean_part: String as \"\"\n    for idx from 0 to total_len - 1:\n        define sym: String as slice directive_text from idx to idx + 1\n        if sym == \"#\":\n            return clean_part\n        set clean_part to clean_part + sym\n    return clean_part\ndefine raw_directive: String as \"cache_size=1024 # megabytes\"\ndefine cleaned_directive: String as trim_inline_comment(raw_directive)\nprint \"Cleaned directive:\", cleaned_directive",
