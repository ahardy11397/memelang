      "canonical_meme": "function count_freq(data: List<Int>, query: Int) -> Int:\n    define freq: Int as 0\n    for each v in data:\n        if v == query:\n            set freq to freq + 1\n    return freq\ndefine list scores as [10, 20, 20, 10, 20, 30]\ndefine f20: Int as count_freq(scores, 20)\nprint \"Frequency of target 20:\", f20",
