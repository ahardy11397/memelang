      "canonical_meme": "function first_vowel_index(w: String) -> Int:\n    define n: Int as length of string w\n    for i from 0 to n - 1:\n        define ch: String as slice w from i to i + 1\n        if ch == \"a\":\n            return i\n        if ch == \"e\":\n            return i\n        if ch == \"i\":\n            return i\n        if ch == \"o\":\n            return i\n        if ch == \"u\":\n            return i\n    return -1\ndefine idx: Int as first_vowel_index(\"rhythm\")\ndefine idx2: Int as first_vowel_index(\"spring\")\nprint \"Vowel in rhythm:\", idx\nprint \"Vowel in spring:\", idx2",
