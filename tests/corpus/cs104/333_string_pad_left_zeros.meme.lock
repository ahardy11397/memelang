      "canonical_meme": "function pad_zeroes(input_str: String, target_len: Int) -> String:\n    define cur_len: Int as length of string input_str\n    define padding: String as \"\"\n    define needed: Int as target_len - cur_len\n    if needed > 0:\n        for step from 1 to needed:\n            set padding to padding + \"0\"\n    return padding + input_str\ndefine code: String as pad_zeroes(\"742\", 6)\nprint \"Padded zero serial:\", code",
