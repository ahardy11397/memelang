      "canonical_meme": "function get_config_value(line: String) -> String:\n    define line_len: Int as length of string line\n    define found_eq: Bool as false\n    define val_buf: String as \"\"\n    for idx from 0 to line_len - 1:\n        define ch: String as slice line from idx to idx + 1\n        if found_eq:\n            set val_buf to val_buf + ch\n        if ch == \"=\":\n            set found_eq to true\n    return val_buf\ndefine directive: String as \"database_host=db.internal.net\"\ndefine val: String as get_config_value(directive)\nprint \"Config value string:\", val",
