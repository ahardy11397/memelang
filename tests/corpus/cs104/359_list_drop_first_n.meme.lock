      "canonical_meme": "function drop_prefix(items: List<String>, count: Int) -> List<String>:\n    define list remaining as empty List<String>\n    define sz: Int as length of items\n    if count < sz:\n        for i from count to sz - 1:\n            append items[i] to remaining\n    return remaining\ndefine list logs as [\"skip1\", \"skip2\", \"data_a\", \"data_b\"]\ndefine list tail_logs as drop_prefix(logs, 2)\nprint \"Remaining items count:\", length of tail_logs\nprint \"First retained log:\", tail_logs[0]",
