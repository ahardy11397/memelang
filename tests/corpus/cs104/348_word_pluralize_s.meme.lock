      "canonical_meme": "function pluralize_word(noun: String, count: Int) -> String:\n    if count == 1:\n        return noun\n    define sz: Int as length of string noun\n    define last_ch: String as slice noun from sz - 1 to sz\n    if last_ch == \"s\":\n        return noun + \"es\"\n    return noun + \"s\"\ndefine p1: String as pluralize_word(\"item\", 1)\ndefine p2: String as pluralize_word(\"item\", 5)\ndefine p3: String as pluralize_word(\"bus\", 2)\nprint \"Single item:\", p1\nprint \"Multiple items:\", p2\nprint \"Plural bus:\", p3",
