      "canonical_meme": "function extract_email_domain(addr: String) -> String:\n    define n: Int as length of string addr\n    define found_at: Bool as false\n    define domain_buf: String as \"\"\n    for i from 0 to n - 1:\n        define ch: String as slice addr from i to i + 1\n        if found_at:\n            set domain_buf to domain_buf + ch\n        if ch == \"@\":\n            set found_at to true\n    return domain_buf\ndefine d: String as extract_email_domain(\"ops-alert@infra.company.com\")\nprint \"Extracted domain:\", d",
