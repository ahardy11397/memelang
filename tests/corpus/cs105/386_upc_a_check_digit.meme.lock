      "canonical_meme": "function upc_check_digit(d11: List<Int>) -> Int:\n    define odd_sum: Int as 0\n    define even_sum: Int as 0\n    for i from 0 to 10:\n        if i % 2 == 0:\n            set odd_sum to odd_sum + d11[i]\n        else:\n            set even_sum to even_sum + d11[i]\n    define total: Int as odd_sum * 3 + even_sum\n    define rem: Int as total % 10\n    if rem == 0:\n        return 0\n    return 10 - rem\ndefine list upc11 as [0, 3, 6, 0, 0, 0, 2, 4, 1, 4, 5]\ndefine upc_cd: Int as upc_check_digit(upc11)\nprint \"Calculated UPC-A check digit:\", upc_cd",
