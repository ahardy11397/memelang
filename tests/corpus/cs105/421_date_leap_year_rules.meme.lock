      "canonical_meme": "function is_leap_year(year: Int) -> Bool:\n    if year % 400 == 0:\n        return true\n    if year % 100 == 0:\n        return false\n    if year % 4 == 0:\n        return true\n    return false\nprint \"Leap year 2024:\", is_leap_year(2024)\nprint \"Leap year 2100:\", is_leap_year(2100)\nprint \"Leap year 2000:\", is_leap_year(2000)",
