      "canonical_meme": "function is_mastercard_prefix(pan: String) -> Bool:\n    define n: Int as length of string pan\n    if n == 16:\n        define prefix: String as slice pan from 0 to 2\n        if prefix == \"51\":\n            return true\n        if prefix == \"52\":\n            return true\n        if prefix == \"53\":\n            return true\n        if prefix == \"54\":\n            return true\n        if prefix == \"55\":\n            return true\n    return false\ndefine mc1: Bool as is_mastercard_prefix(\"5300123456789012\")\ndefine mc2: Bool as is_mastercard_prefix(\"4000123456789012\")\nprint \"Mastercard match 1:\", mc1\nprint \"Mastercard match 2:\", mc2",
