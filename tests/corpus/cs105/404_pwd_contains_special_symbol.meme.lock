      "canonical_meme": "function has_special_symbol(pwd: String) -> Bool:\n    define n: Int as length of string pwd\n    for i from 0 to n - 1:\n        define ch: String as slice pwd from i to i + 1\n        if ch == \"!\":\n            return true\n        if ch == \"@\":\n            return true\n        if ch == \"#\":\n            return true\n        if ch == \"$\":\n            return true\n        if ch == \"%\":\n            return true\n        if ch == \"&\":\n            return true\n        if ch == \"*\":\n            return true\n    return false\nprint \"Symbol check safe#:\", has_special_symbol(\"safe#pass\")\nprint \"Symbol check safepass:\", has_special_symbol(\"safepass\")",
