      "canonical_meme": "function check_email_parts(email: String) -> Bool:\n    define n: Int as length of string email\n    define at_idx: Int as -1\n    for i from 0 to n - 1:\n        define ch: String as slice email from i to i + 1\n        if ch == \"@\":\n            set at_idx to i\n    if at_idx <= 0:\n        return false\n    if at_idx >= n - 1:\n        return false\n    return true\nprint \"Standard address valid:\", check_email_parts(\"admin@server.org\")\nprint \"Empty user invalid:\", check_email_parts(\"@server.org\")\nprint \"Empty domain invalid:\", check_email_parts(\"admin@\")",
