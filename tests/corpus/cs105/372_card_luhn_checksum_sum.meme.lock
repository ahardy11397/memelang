      "canonical_meme": "function is_luhn_valid(digits: List<Int>) -> Bool:\n    define n: Int as length of digits\n    define total: Int as 0\n    for i from 0 to n - 1:\n        define pos_from_right: Int as n - 1 - i\n        define d: Int as digits[i]\n        if pos_from_right % 2 == 1:\n            define doubled: Int as d * 2\n            if doubled > 9:\n                set total to total + doubled - 9\n            else:\n                set total to total + doubled\n        else:\n            set total to total + d\n    return total % 10 == 0\ndefine list sample_card as [4, 5, 3, 9, 1, 4, 8, 8, 0, 3, 4, 3, 6, 4, 6, 7]\nprint \"Luhn valid check:\", is_luhn_valid(sample_card)",
