      "canonical_meme": "function clamp_int(val: Int, low_b: Int, high_b: Int) -> Int:\n    if val < low_b:\n        return low_b\n    if val > high_b:\n        return high_b\n    return val\ndefine c1: Int as clamp_int(150, 0, 100)\ndefine c2: Int as clamp_int(-5, 0, 100)\ndefine c3: Int as clamp_int(42, 0, 100)\nprint \"Clamped high val:\", c1\nprint \"Clamped low val:\", c2\nprint \"Clamped inside val:\", c3",
