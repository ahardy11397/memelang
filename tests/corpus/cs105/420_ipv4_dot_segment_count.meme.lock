      "canonical_meme": "function is_ipv4_dot_count(ip: String) -> Bool:\n    define n: Int as length of string ip\n    define dots: Int as 0\n    for i from 0 to n - 1:\n        define ch: String as slice ip from i to i + 1\n        if ch == \".\":\n            set dots to dots + 1\n    return dots == 3\nprint \"IPv4 dot count check:\", is_ipv4_dot_count(\"192.168.1.1\")",
