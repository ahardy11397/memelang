      "canonical_meme": "function has_consecutive_dots(s: String) -> Bool:\n    define n: Int as length of string s\n    if n >= 2:\n        for i from 0 to n - 2:\n            define pair: String as slice s from i to i + 2\n            if pair == \"..\":\n                return true\n    return false\nprint \"Has double dot 1:\", has_consecutive_dots(\"john..doe@domain.com\")\nprint \"Has double dot 2:\", has_consecutive_dots(\"john.doe@domain.com\")",
