      "canonical_meme": "function is_amex_number(pan: String) -> Bool:\n    define n: Int as length of string pan\n    if n == 15:\n        define prefix: String as slice pan from 0 to 2\n        if prefix == \"34\":\n            return true\n        if prefix == \"37\":\n            return true\n    return false\ndefine ax1: Bool as is_amex_number(\"378282246310005\")\ndefine ax2: Bool as is_amex_number(\"358282246310005\")\nprint \"Amex card check 1:\", ax1\nprint \"Amex card check 2:\", ax2",
