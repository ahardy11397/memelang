      "canonical_meme": "function domain_has_dot(domain: String) -> Bool:\n    define n: Int as length of string domain\n    for i from 0 to n - 1:\n        define ch: String as slice domain from i to i + 1\n        if ch == \".\":\n            return true\n    return false\nprint \"Domain with dot:\", domain_has_dot(\"example.com\")\nprint \"Domain without dot:\", domain_has_dot(\"localhost\")",
