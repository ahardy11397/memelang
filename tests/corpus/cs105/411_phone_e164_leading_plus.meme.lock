      "canonical_meme": "function is_e164_format(phone: String) -> Bool:\n    define n: Int as length of string phone\n    if n >= 8:\n        if n <= 16:\n            define first_ch: String as slice phone from 0 to 1\n            if first_ch == \"+\":\n                return true\n    return false\nprint \"E.164 plus check 1:\", is_e164_format(\"+14155552671\")\nprint \"E.164 plus check 2:\", is_e164_format(\"14155552671\")",
