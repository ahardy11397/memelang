      "canonical_meme": "function is_email_valid_simple(email: String) -> Bool:\n    define n: Int as length of string email\n    if n < 6:\n        return false\n    define at_count: Int as 0\n    define has_dot: Bool as false\n    for i from 0 to n - 1:\n        define ch: String as slice email from i to i + 1\n        if ch == \" \":\n            return false\n        if ch == \"@\":\n            set at_count to at_count + 1\n        if ch == \".\":\n            set has_dot to true\n    if at_count != 1:\n        return false\n    if not has_dot:\n        return false\n    return true\nprint \"Valid email composite:\", is_email_valid_simple(\"dev@test.io\")\nprint \"Invalid email composite:\", is_email_valid_simple(\"dev test.io\")",
