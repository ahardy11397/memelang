      "canonical_meme": "function isbn10_weight_sum(digits: List<Int>) -> Int:\n    define total: Int as 0\n    for i from 0 to 8:\n        define weight: Int as 10 - i\n        set total to total + digits[i] * weight\n    return total\ndefine list isbn_nine as [0, 3, 0, 6, 4, 0, 6, 1, 5]\ndefine sum_val: Int as isbn10_weight_sum(isbn_nine)\nprint \"ISBN-10 weighted total:\", sum_val",
