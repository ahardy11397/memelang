      "canonical_meme": "function user_dots_safe(user: String) -> Bool:\n    define n: Int as length of string user\n    if n == 0:\n        return false\n    define first_ch: String as slice user from 0 to 1\n    define last_ch: String as slice user from n - 1 to n\n    if first_ch == \".\":\n        return false\n    if last_ch == \".\":\n        return false\n    return true\nprint \"Safe user dots 1:\", user_dots_safe(\"alex.smith\")\nprint \"Safe user dots 2:\", user_dots_safe(\".alex\")\nprint \"Safe user dots 3:\", user_dots_safe(\"alex.\")",
